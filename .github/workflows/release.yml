name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: your-app-macos
          - os: windows-latest
            artifact: your-app-windows.exe
          - os: ubuntu-latest
            artifact: your-app-linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          native-image-job-reports: 'true'


      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build jar
        run: ./gradlew shadowJar

      - name: Build native image
        run: native-image -jar build/libs/*-all.jar ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            your-app-macos/*
            your-app-windows.exe/*
            your-app-linux/*
